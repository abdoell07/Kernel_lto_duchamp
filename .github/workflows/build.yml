name: Build Kernel (duchamp)

on:
  workflow_dispatch:

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest.git
  MANIFEST_BRANCH: common-android14-6.1-lts
  LOCAL_MANIFEST_URL: https://github.com/mt6897-devs/kernel_manifest

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 bc bison flex libssl-dev \
            libelf-dev lld clang llvm zip unzip rsync cpio ccache

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false

      - name: Sync source
        run: |
          mkdir -p "$HOME/kernel"
          cd "$HOME/kernel"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          git clone "$LOCAL_MANIFEST_URL" .repo/local_manifests
          repo sync -c -j4 --no-tags --no-clone-bundle --optimized-fetch --force-sync

      - name: Build kernel and modules
        run: |
          cd "$HOME/kernel"
          ./kernel_device_modules-6.1/build.sh

      - name: Package output
        run: |
          cd "$HOME/kernel"
          ls -lh out/dist/
          mkdir -p "$GITHUB_WORKSPACE/result"
          tar -czf "$GITHUB_WORKSPACE/result/duchamp-kernel-dist.tar.gz" -C out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duchamp-kernel-dist
          path: result/duchamp-kernel-dist.tar.gz
          
